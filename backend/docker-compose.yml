version: "3.6"

services:
  neo4j:
    image: neo4j:5.18-community
    container_name: weekend_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/littlehuman123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "littlehuman123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: weekend_api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=littlehuman123
      - PORT=3001
    depends_on:
      - neo4j

volumes:
  neo4j_data:
  neo4j_logs:
