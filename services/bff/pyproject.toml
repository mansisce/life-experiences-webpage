[project]
name = "rewards-bff"
version = "0.1.0"
description = "Backend-for-frontend for the Rewards microfrontend, Streamlit dashboard and (later) Android app"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.6",
    "tzdata>=2024.1",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
