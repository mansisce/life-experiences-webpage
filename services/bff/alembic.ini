# Alembic config for the Rewards BFF. The database URL comes from BFF settings (BFF_DATABASE_URL),
# not from this file. Normal use needs no manual commands: the BFF migrates itself on startup.
#
#   uv run alembic revision --autogenerate -m "add due date" --rev-id 0003_due_date   # new migration
#   uv run alembic upgrade head                                                       # apply manually
#   uv run alembic current                                                            # where am I?

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
