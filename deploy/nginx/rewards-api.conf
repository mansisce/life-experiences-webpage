# /etc/nginx/sites-available/rewards-api  (then run certbot for this name)
# Rate limit: 10 requests/s per IP with short bursts. limit_req_zone is allowed here because
# sites-enabled files are included inside nginx's http block.
limit_req_zone $binary_remote_addr zone=rewards_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name rewards-api.64-227-167-131.nip.io;

    # Bills and photos are up to 10 MB in the BFF (MAX_FILE_BYTES); nginx's default is 1 MB.
    client_max_body_size 12m;

    add_header X-Robots-Tag "noindex, nofollow" always;
    # Ignored over plain HTTP; takes effect once certbot adds HTTPS to this server block.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        limit_req zone=rewards_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
