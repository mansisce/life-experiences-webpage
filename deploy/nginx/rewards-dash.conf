# /etc/nginx/sites-available/rewards-dash  (replace <name> with your DuckDNS name, then run certbot)
server {
    listen 80;
    listen [::]:80;
    server_name <name>-dash.duckdns.org;

    add_header X-Robots-Tag "noindex, nofollow" always;
    # Ignored over plain HTTP; takes effect once certbot adds HTTPS to this server block.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamlit talks to the browser over a WebSocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
